services:
  pipeline:
    build: .
    working_dir: /app
    environment:
      TPCDS_TOOL_DIR: /input/tpcds-tool
      SCENARIOS_DIR: /app/scenarios
      TPCDS_SCALE: ${TPCDS_SCALE}
    volumes:
      - type: bind
        source: ${TPCDS_TOOL_DIR}
        target: /input/tpcds-tool
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SCENARIOS_DIR}
        target: /app/scenarios
        bind:
          create_host_path: true
