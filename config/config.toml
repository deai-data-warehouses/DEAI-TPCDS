[general]
runs_per_query = 3

[spark]
use_partition = true
adaptative_enabled = true
adaptative_coalesce_partitions = true
adapatative_skew_join = true
# -1 disables auto broadcast, 10 default, 50 or 100 tuning
broadcast_threshold_mb = 100
# -1 for dynamic calculation
shuffle_partitions = 16
# 1. Fil computacional: true = local[*], false = local[4]
use_all_cores = true
# 2. Ajust de memòria: true = fraction 0.8 / storage 0.3, false = valors per defecte de Spark (0.6 / 0.5)
tune_memory_allocation = true
# 3. Caching estàtic de dimensions
enable_static_caching = true
# Unused
use_broadcast_joins_hints = true
