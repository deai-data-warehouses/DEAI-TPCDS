[general]
runs_per_query = 2

[spark]
use_partition = false
use_broadcast_joins_hints = false
adaptative_enabled = true
adaptative_coalesce_partitions = false
adapatative_skew_join = false
broadcast_threshold_mb = 10            # -1 disables auto broadcast
register_tables_as = "tables"          # "views" (temp views) or "tables" (catalog tables)
cbo_enabled = true                     # requires register_tables_as = "tables"
cbo_join_reorder = true                # requires cbo_enabled = true
